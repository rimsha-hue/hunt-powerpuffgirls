name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Bandit
        run: bandit -c pyproject.toml -r app -ll
      - name: pip-audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t power-hunt:ci .
      - name: Smoke test container
        run: |
          docker run -d --name ph -p 8000:8000 -e SECRET_KEY=ci-only-not-a-secret-0123456789abcdef power-hunt:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ready && break; sleep 1; done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q "Power Hunt"
          docker logs ph
