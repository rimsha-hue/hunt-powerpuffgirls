name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests eval
          ruff format --check app tests eval
      - name: Type check
        run: mypy app eval
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      # Fails if the shipped INFER_THRESHOLD catches fewer fabrications or raises more false
      # alarms than eval/baseline.json records. Downloads the embedding model (about 70 MB).
      - name: Claim eval baseline
        run: python -m eval.run --check
      - name: Bandit
        run: bandit -c pyproject.toml -r app -ll
      # Pillow 12.3.0 has CVEs fixed only in 13.0, but fastembed 0.9.0 (the newest) pins
      # pillow<13, so it can't be upgraded yet. They are in Pillow's image decoding, which this app
      # never reaches: no app code imports PIL, the CV writer adds no images, PDFs are read as text
      # (no to_image), and only fastembed's text model is used. Remove these flags once fastembed
      # allows Pillow 13; any other vulnerability still fails the build.
      - name: pip-audit
        run: >-
          pip-audit --skip-editable
          --ignore-vuln CVE-2026-112395
          --ignore-vuln CVE-2026-112397
          --ignore-vuln CVE-2026-112400
          --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112895
          --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897
          --ignore-vuln CVE-2026-112899

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t power-hunt:ci .
      - name: Smoke test container
        run: |
          docker run -d --name ph -p 8000:8000 -e SECRET_KEY=ci-only-not-a-secret-0123456789abcdef power-hunt:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ready && break; sleep 1; done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q "Power Hunt"
          docker logs ph
