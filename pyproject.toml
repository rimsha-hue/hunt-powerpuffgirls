[project]
name = "power-hunt"
version = "0.1.0"
description = "Human-in-the-loop job application agent. No source, no claim."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "aiosqlite>=0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "structlog>=24.4",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "limits>=4.0",
    "phonenumbers>=8.13",
    "geonamescache>=2.0",
    "litellm>=1.55",
    "beautifulsoup4>=4.12",
    "yake>=0.4.8",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "docx.*", "litellm.*", "geonamescache.*", "yake.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "frontend"]
